name: Development security checks
on:
  push:
    branches:
      - development/cloud-foundation-audit
  pull_request:
    branches:
      - main
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check
      - run: npm test
      - run: node tests/security-regression.mjs
      - run: node tests/workspace-isolation.mjs
