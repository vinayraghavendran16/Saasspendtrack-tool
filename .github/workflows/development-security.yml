name: Development security checks
on:
  push:
    branches:
      - development/cloud-foundation-audit
      - 'release/**'
  pull_request:
    branches:
      - main
      - development/cloud-foundation-audit
      - 'release/**'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run test:release
