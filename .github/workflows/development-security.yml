name: Development security checks
on:
  push:
    branches:
      - development/cloud-foundation-audit
      - 'release/**'
  pull_request:
    branches:
      - main
      - development/cloud-foundation-audit
      - 'release/**'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run test:release
      - run: npx playwright install --with-deps chromium
      # Use the runner's supported user namespace configuration, keeping Chromium sandboxed.
      - name: Configure Chromium user namespaces on ephemeral CI runner
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          unshare --user --map-root-user true
      - run: npm run test:e2e:local
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: local-browser-regression-evidence
          path: test-results/local/
          if-no-files-found: ignore
          retention-days: 7
  cross-engine:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npm run test:e2e:local
        env:
          E2E_BROWSER: ${{ matrix.browser }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: local-browser-${{ matrix.browser }}-evidence
          path: test-results/local/
          if-no-files-found: ignore
          retention-days: 7
