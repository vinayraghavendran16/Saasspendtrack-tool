name: Checkout regression
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checkout:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run checkout regression suite
        run: npm run test:checkout
      - name: Rehearse combined migrations
        run: python3 tests/combined-migrations.py
