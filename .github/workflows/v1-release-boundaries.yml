name: V1 release boundaries
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  boundaries:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: python3 tests/member-mutation-race.py
      - run: node tests/release-financial-boundaries.mjs
      - run: node tests/release-ai-egress.mjs

      - run: node tests/release-calendar.mjs

      - run: node tests/release-retention.mjs

      - run: node tests/release-rate-limit.mjs

      - run: python3 tests/release-entitlement-race.py

      - run: python3 tests/trial-delivery-claims.py

      - run: node tests/trial-scheduler.mjs

      - run: node tests/trial-delivery-admin.mjs
