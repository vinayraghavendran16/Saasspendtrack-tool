name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax-check all Pages Functions
        run: for f in $(find functions -name '*.js'); do node --check "$f" || exit 1; done
      - name: Run unit tests (auth, entitlement, rate limit, SSRF, data)
        run: node tests/unit.mjs
